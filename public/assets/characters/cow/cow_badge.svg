<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="cowGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#edf2f7" />
    </radialGradient>
    <radialGradient id="hornGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="100%" stop-color="#d4af37" />
    </radialGradient>
  </defs>
  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#f0fff4" stroke="#2ecc71" stroke-width="4"/>
  <!-- Golden Horns -->
  <path d="M 28 32 Q 22 18 16 22 Q 22 28 29 36 Z" fill="url(#hornGrad)" stroke="#c59b27" stroke-width="1.5"/>
  <path d="M 72 32 Q 78 18 84 22 Q 78 28 71 36 Z" fill="url(#hornGrad)" stroke="#c59b27" stroke-width="1.5"/>
  <!-- Floppy Ears -->
  <ellipse cx="20" cy="40" rx="9" ry="5" fill="#f8f9fa" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-20, 20, 40)"/>
  <ellipse cx="20" cy="40" rx="6" ry="3" fill="#ffb8b8" transform="rotate(-20, 20, 40)"/>
  <ellipse cx="80" cy="40" rx="9" ry="5" fill="#f8f9fa" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(20, 80, 40)"/>
  <ellipse cx="80" cy="40" rx="6" ry="3" fill="#ffb8b8" transform="rotate(20, 80, 40)"/>
  <!-- Head -->
  <circle cx="50" cy="52" r="30" fill="url(#cowGrad)" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Chocolate Patch over right eye -->
  <path d="M 52 32 Q 68 34 70 48 Q 62 58 52 50 Z" fill="#503426"/>
  <!-- Eyes with double specular highlight -->
  <ellipse cx="38" cy="46" rx="4.5" ry="6" fill="#2d3436"/>
  <circle cx="36.5" cy="44.5" r="2" fill="#ffffff"/>
  <circle cx="39" cy="49" r="1" fill="#ffffff"/>
  <ellipse cx="62" cy="46" rx="4.5" ry="6" fill="#2d3436"/>
  <circle cx="60.5" cy="44.5" r="2" fill="#ffffff"/>
  <circle cx="63" cy="49" r="1" fill="#ffffff"/>
  <!-- Snout / Muzzle -->
  <ellipse cx="50" cy="65" rx="16" ry="11" fill="#ffccd5" stroke="#f48fb1" stroke-width="1.5"/>
  <circle cx="43" cy="64" r="2.2" fill="#884d5c"/>
  <circle cx="57" cy="64" r="2.2" fill="#884d5c"/>
  <!-- Brass Bell & Collar -->
  <path d="M 40 76 Q 50 82 60 76" stroke="#e74c3c" stroke-width="3" fill="none"/>
  <circle cx="50" cy="81" r="5" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
</svg>
