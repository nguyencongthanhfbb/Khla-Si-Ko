<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="tigerGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff9f43" />
      <stop offset="100%" stop-color="#ee5253" />
    </radialGradient>
    <radialGradient id="goldGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="100%" stop-color="#d4af37" />
    </radialGradient>
  </defs>
  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#fff5ea" stroke="#f39c12" stroke-width="4"/>
  <!-- Ears -->
  <circle cx="28" cy="28" r="14" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <circle cx="28" cy="28" r="8" fill="#ffd8a8"/>
  <circle cx="72" cy="28" r="14" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <circle cx="72" cy="28" r="8" fill="#ffd8a8"/>
  <!-- Head -->
  <circle cx="50" cy="54" r="32" fill="url(#tigerGrad)"/>
  <!-- Cheeks -->
  <ellipse cx="36" cy="62" rx="12" ry="9" fill="#ffffff"/>
  <ellipse cx="64" cy="62" rx="12" ry="9" fill="#ffffff"/>
  <circle cx="24" cy="60" r="5" fill="#ff7675" opacity="0.6"/>
  <circle cx="76" cy="60" r="5" fill="#ff7675" opacity="0.6"/>
  <!-- Khmer Lotus Forehead Crest -->
  <path d="M 50 30 C 47 38 43 41 43 45 C 47 45 49 43 50 40 C 51 43 53 45 57 45 C 57 41 53 38 50 30 Z" fill="url(#goldGrad)"/>
  <!-- Eyes with double specular highlight -->
  <ellipse cx="38" cy="48" rx="5" ry="6.5" fill="#2d3436"/>
  <circle cx="36.5" cy="46" r="2.2" fill="#ffffff"/>
  <circle cx="39.5" cy="51" r="1.1" fill="#ffffff"/>
  <ellipse cx="62" cy="48" rx="5" ry="6.5" fill="#2d3436"/>
  <circle cx="60.5" cy="46" r="2.2" fill="#ffffff"/>
  <circle cx="63.5" cy="51" r="1.1" fill="#ffffff"/>
  <!-- Nose & Mouth -->
  <polygon points="50,60 46,56 54,56" fill="#d63031"/>
  <path d="M 46 62 Q 50 66 54 62" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <!-- Side Stripes -->
  <path d="M 20 48 Q 28 50 24 54" fill="none" stroke="#4a2810" stroke-width="3" stroke-linecap="round"/>
  <path d="M 80 48 Q 72 50 76 54" fill="none" stroke="#4a2810" stroke-width="3" stroke-linecap="round"/>
</svg>
